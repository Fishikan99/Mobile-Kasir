<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir Mobile - Smart POS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff8f1',
              100: '#feebd4',
              200: '#fbd4aa',
              300: '#f8b475',
              400: '#f4893d',
              500: '#f06414', // Primary orange
              600: '#d94909',
              700: '#b4330b',
            },
            bgSoft: '#fbf8f5',
            cardBg: '#ffffff',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for hidden look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Print styles for Receipt */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-receipt, #printable-receipt * {
        visibility: visible;
      }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
      }
    }
  </style>
</head>
<body class="bg-stone-200 min-h-screen flex items-center justify-center font-sans p-0 sm:p-4 text-stone-800 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Outer Mobile Container Simulator -->
  <div class="relative w-full max-w-[420px] h-[100vh] sm:h-[880px] bg-stone-900 sm:rounded-[48px] shadow-2xl overflow-hidden border-0 sm:border-[10px] border-stone-800 flex flex-col">
    
    <!-- Phone Top Status Bar / Dynamic Island -->
    <div class="bg-bgSoft px-6 pt-3 pb-2 flex justify-between items-center z-30 shrink-0 select-none">
      <span id="current-time" class="text-xs font-bold text-stone-900 tracking-tight">09:41</span>
      <!-- Notch / Dynamic Island -->
      <div class="w-24 h-4 bg-stone-900 rounded-full hidden sm:block"></div>
      <div class="flex items-center space-x-1.5 text-xs text-stone-800">
        <i class="fa-solid font-bold fa-signal text-[10px]"></i>
        <i class="fa-solid font-bold fa-wifi text-[10px]"></i>
        <i class="fa-solid font-bold fa-battery-full text-xs"></i>
      </div>
    </div>

    <!-- MAIN APP SCREEN AREA -->
    <div class="flex-1 bg-bgSoft relative overflow-hidden flex flex-col">

      <!-- ========================================== -->
      <!-- SCREEN 1: PURCHASE / MENU CATALOG          -->
      <!-- ========================================== -->
      <section id="screen-catalog" class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Header -->
        <div class="px-5 pt-3 pb-2 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-3">
            <button class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-stone-700 active:scale-95 transition-transform">
              <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <h1 class="text-lg font-bold text-stone-900">Kasir Resto</h1>
          </div>
          <button onclick="openAddProductModal()" class="bg-brand-100 text-brand-600 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 hover:bg-brand-200 transition-colors">
            <i class="fa-solid fa-plus"></i> Menu Baru
          </button>
        </div>

        <!-- Search Bar -->
        <div class="px-5 py-2 shrink-0">
          <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-stone-400 text-xs"></i>
            <input type="text" id="search-input" oninput="renderProducts()" placeholder="Cari menu makanan/minuman..." 
              class="w-full bg-white pl-9 pr-10 py-2.5 rounded-2xl text-xs font-medium text-stone-800 placeholder-stone-400 border border-stone-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500/30">
            <button class="absolute right-3 text-stone-400 hover:text-brand-500">
              <i class="fa-solid fa-qrcode text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Categories Filter -->
        <div class="px-5 py-2 flex gap-2 overflow-x-auto no-scrollbar shrink-0">
          <button onclick="setCategory('all')" id="cat-all" class="cat-btn bg-brand-500 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm shadow-brand-500/20">Semua</button>
          <button onclick="setCategory('makanan')" id="cat-makanan" class="cat-btn bg-white text-stone-600 border border-stone-100 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Makanan</button>
          <button onclick="setCategory('minuman')" id="cat-minuman" class="cat-btn bg-white text-stone-600 border border-stone-100 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Minuman</button>
          <button onclick="setCategory('snack')" id="cat-snack" class="cat-btn bg-white text-stone-600 border border-stone-100 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Cemilan</button>
        </div>

        <!-- Products Grid (Scrollable) -->
        <div class="flex-1 overflow-y-auto px-5 py-3 no-scrollbar pb-24">
          <div id="product-grid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic Product Cards Injected Here -->
          </div>
        </div>

        <!-- Floating Cart Bar (Appears when items selected) -->
        <div id="floating-cart-bar" class="absolute bottom-16 left-4 right-4 bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-stone-100/80 flex items-center justify-between z-20 transition-all transform translate-y-32">
          <div class
