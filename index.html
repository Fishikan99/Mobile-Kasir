<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS App UI</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- SDK Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="mobile-frame">
        <div class="notch"></div>

        <!-- Top Status Bar -->
        <div class="status-bar">
            <span>9:30</span>
            <span>📶 🔋</span>
        </div>

        <!-- Top App Header -->
        <div class="app-header">
            <div class="header-left">
                <div class="btn-icon-circle">☰</div>
                <h1 class="header-title" id="header-title">Purchase Management</h1>
            </div>
            <button class="btn-pill-add" onclick="showPage('barang')">Add Item</button>
        </div>

        <!-- Search Bar Component -->
        <div class="search-wrapper">
            <div class="search-input-box">
                🔍 <input type="text" id="cariBarang" placeholder="Search dishes by name..." oninput="cariBarang()"> 📷
            </div>
        </div>

        <!-- Category Horizontal Filter Scroll -->
        <div class="category-bar">
            <div class="chip-item active">All</div>
            <div class="chip-item">Fruits</div>
            <div class="chip-item">Shakes</div>
            <div class="chip-item">Burger</div>
            <div class="chip-item">Snacks</div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            
            <!-- 1. HALAMAN UTAMA BARANG / PURCHASE MANAGEMENT (GAMBAR SISI KIRI) -->
            <section id="barang" class="page active">
                <div class="grid-products" id="gridBarang">
                    <!-- Kartu Produk dari Database Firebase -->
                </div>

                <!-- Form Tambah Barang Baru -->
                <div style="background: white; padding: 14px; border-radius: 16px; margin-top: 20px; border: 1px solid #F0E6DD;">
                    <h4 style="margin:0 0 10px 0;">+ Tambah Barang Baru</h4>
                    <input type="text" id="namaBarang" placeholder="Nama Barang" style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #ddd; border-radius:8px;">
                    <input type="number" id="hargaBarang" placeholder="Harga" style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #ddd; border-radius:8px;">
                    <input type="number" id="stokBarang" placeholder="Stok" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">
                    <button onclick="tambahBarang()" style="width:100%; background:#E8702A; color:white; border:none; padding:10px; border-radius:12px; font-weight:bold; cursor:pointer;">Simpan Barang</button>
                </div>
            </section>

            <!-- 2. HALAMAN TRANSAKSI / CONFIRM SALE (GAMBAR SISI KANAN) -->
            <section id="transaksi" class="page">
                <div style="background: white; padding: 12px; border-radius: 14px; margin-bottom: 10px; border: 1px solid #F0E6DD;">
                    <label style="font-size:11px; color:#888;">Pilih Barang</label>
                    <select id="pilihBarang" style="width:100%; border:none; outline:none; background:transparent; font-weight:bold;"></select>
                </div>
                
                <div style="background: white; padding: 12px; border-radius: 14px; margin-bottom: 10px; border: 1px solid #F0E6DD;">
                    <label style="font-size:11px; color:#888;">Jumlah</label>
                    <input type="number" id="jumlahBarang" value="1" min="1" style="width:100%; border:none; outline:none; font-weight:bold;">
                </div>
                
                <button onclick="tambahKeranjang()" style="width:100%; background:#FFF; border:1px solid #E8702A; color:#E8702A; padding:10px; border-radius:14px; font-weight:bold; margin-bottom:12px; cursor:pointer;">+ Add Items</button>

                <h4 style="margin: 10px 0 6px 0;">Billing Items</h4>
                <div id="listKeranjang"></div>

                <!-- Action Extra Pills -->
                <div style="display:flex; gap:6px; margin: 12px 0;">
                    <button style="background:#FFF; border:1px solid #EAE0D5; padding:6px 10px; border-radius:12px; font-size:10px; color:#E8702A;">+ Add Discount</button>
                    <button style="background:#FFF; border:1px solid #EAE0D5; padding:6px 10px; border-radius:12px; font-size:10px; color:#E8702A;">+ Add TAX</button>
                </div>

                <div style="background: white; padding: 12px; border-radius: 14px; border: 1px solid #F0E6DD;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="font-size:12px; color:#666;">Total Amount</span>
                        <span id="total" style="font-size:14px; font-weight:bold; color:#E8702A;">Rp 0</span>
                    </div>
                    <input type="number" id="pembayaran" placeholder="Nominal Pembayaran (Cash)" style="width:100%; padding:8px; border:1px solid #eee; border-radius:8px; margin-bottom:10px;">
                    <button onclick="bayar()" style="width:100%; background:#E8702A; color:white; border:none; padding:12px; border-radius:14px; font-weight:bold; cursor:pointer;">Save Item</button>
                    <p style="text-align:center; font-size:11px; margin-top:6px;">Kembalian: <span id="kembalian">Rp 0</span></p>
                </div>
            </section>

            <!-- 3. HALAMAN RIWAYAT / TRANSACTIONS (GAMBAR SISI TENGAH) -->
            <section id="riwayat" class="page">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span style="font-size:12px; font-weight:bold;">📅 All Time</span>
                    <button onclick="hapusRiwayat()" style="border:none; background:transparent; color:#E74C3C; font-size:11px;">Clear All</button>
                </div>
                <div id="listRiwayat"></div>
            </section>

            <!-- 4. HALAMAN PRE-ORDER -->
            <section id="preorder" class="page">
                <h4 style="margin-top:0;">Daftar Pre-Order Active</h4>
                <div id="listPreOrder"></div>
            </section>

        </div>

        <!-- Floating Cart Bar (Gaya Gambar Kiri) -->
        <div class="cart-floating-bar" id="floatingCart" onclick="showPage('transaksi')">
            <div>
                <span id="cartCount" style="font-size:10px; color:#888; display:block;">2 Items</span>
                <span id="cartTotal" style="font-size:13px; font-weight:bold; color:#111;">Rp 0</span>
            </div>
            <button class="btn-next-orange">Next</button>
        </div>

        <!-- Bottom Navigation Bar (Presisi Gambar UI) -->
        <div class="bottom-nav">
            <button class="nav-btn active" onclick="showPage('barang')" id="nav-barang">
                <div class="nav-icon-circle">🏠</div>
                <span>Home</span>
            </button>
            <button class="nav-btn" onclick="showPage('transaksi')" id="nav-transaksi">
                <div class="nav-icon-circle">🏷️</div>
                <span>Transaction</span>
            </button>
            <button class="nav-btn" onclick="showPage('preorder')" id="nav-preorder">
                <div class="nav-icon-circle">📋</div>
                <span>Pre-Order</span>
            </button>
            <button class="nav-btn" onclick="showPage('riwayat')" id="nav-riwayat">
                <div class="nav-icon-circle">📊</div>
                <span>History</span>
            </button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
            
            const targetPage = document.getElementById(pageId);
            if (targetPage) targetPage.classList.add("active");
            
            const targetBtn = document.getElementById("nav-" + pageId);
            if (targetBtn) targetBtn.classList.add("active");

            const titleMap = {
                'barang': 'Purchase Management',
                'transaksi': 'Confirm Sale',
                'preorder': 'Pre-Order List',
                'riwayat': 'Transactions'
            };
            document.getElementById("header-title").innerText = titleMap[pageId] || 'Kasir App';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
